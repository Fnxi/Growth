services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-growth_lab}
      POSTGRES_USER: ${POSTGRES_USER:-growth_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  monitor:
    build: .
    profiles: ["monitoring"]
    restart: on-failure
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-growth_lab}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-growth_lab}
      MONITORING_SCHEDULER_ENABLED: ${MONITORING_SCHEDULER_ENABLED:-false}
      MONITORING_CHECK_INTERVAL_SECONDS: ${MONITORING_CHECK_INTERVAL_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
